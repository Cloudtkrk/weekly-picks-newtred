# 週次おすすめ商品の2段階配信:
#  1) input/ にKalodataエクスポートをプッシュ → プレビューを /preview/ に自動生成 (公開・Discordなし)
#  2) プレビュー確認後、本公開 + Discord投稿。次のどちらでもよい:
#       a) Actionsタブ「Weekly Picks」→ Run workflow (手動)
#       b) publish/REQUEST.md を更新し、コミットメッセージを publish: で始めてプッシュ
#          (Actions画面を開けない環境から公開するための経路)
name: Weekly Picks

on:
  push:
    paths:
      - "input/**"
      - "publish/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-picks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- ステージ1: プレビュー生成 (input/ 更新で自動。本番には触らない) ----
  #      publish: で始まるプッシュは公開のリクエストなので、プレビューは作らない
  preview:
    if: >-
      github.event_name == 'push'
      && !startsWith(github.event.head_commit.message, 'publish:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # publish/ やコードだけを触ったプッシュでプレビューを作り直しても中身は同じで、
      # 生成日だけが変わった差分をpushしてしまう (=無駄なコミットと競合の元)
      - name: Check whether input/ changed
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            files=$(git show --name-only --pretty=format: "$AFTER")
          fi
          echo "変更ファイル:"; echo "$files"
          if grep -q '^input/' <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "input/ に変更がないためプレビュー生成をスキップします"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Generate preview (no archive, no Discord)
        if: steps.scope.outputs.run == 'true'
        run: python weekly_data_v1.py --auto input/ --html --no-archive

      - name: Add preview banner
        if: steps.scope.outputs.run == 'true'
        run: |
          python - <<'EOF'
          import glob
          for f in glob.glob("weekly_site/*.html"):
              s = open(f, encoding="utf-8").read()
              s = s.replace("</header>", "</header>"
                  '<div class="arch-note">🧪 プレビュー版です。この内容で公開してよければ '
                  'Claudeに「公開して」と伝えるか、GitHub Actions の「Weekly Picks」→ '
                  'Run workflow を実行してください'
                  '（Web公開とDiscord投稿が行われます）</div>', 1)
              open(f, "w", encoding="utf-8").write(s)
          EOF

      - name: Publish preview to /preview/ (commit & push)
        if: steps.scope.outputs.run == 'true'
        run: |
          rm -rf preview
          mkdir -p preview
          cp weekly_site/*.html preview/
          # 🤝 NewTrend商品一覧タブを差し込む (プレビューからは ../tap.html を参照)
          python build_tap.py preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/
          if git diff --cached --quiet; then
            echo "変更なし: コミットをスキップ"
          else
            git commit -m "chore: プレビュー更新 $(date -u +%Y-%m-%d) [skip ci]"
            # 生成中に別のプッシュがmainに入ると fetch first で弾かれるので、
            # リベースして数回まで再試行する
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push失敗 ($i/3)。リベースして再試行します"
              git pull --rebase origin main
            done
            echo "3回試しても push できませんでした"; exit 1
          fi

  # ---- ステージ2: 本公開 + Discord投稿 ----
  #      Run workflow の手動実行、または publish: で始まるコミットのプッシュで走る。
  #      「含む」ではなく「で始まる」なのは、本文で [publish] に言及しただけの
  #      コミットが誤って公開してしまうのを防ぐため
  #      通常のプッシュ (プレビュー生成やコード修正) では絶対に走らない
  publish:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && startsWith(github.event.head_commit.message, 'publish:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 生成が失敗した場合はここで止まり、Discord投稿もサイト更新も行われない
      - name: Generate site and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python weekly_data_v1.py --auto input/ --html --post --top-per-cat 3

      - name: Publish site (commit & push)
        run: |
          cp weekly_site/index.html index.html
          cp weekly_site/challenge.html challenge.html
          # tap.html を最新の件数で作り直し、売れ筋/新商品のタブに 🤝 を差し込む
          python build_tap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch --quiet preview || true
          git add -A index.html challenge.html tap.html archive/ data/
          if git diff --cached --quiet; then
            echo "変更なし: コミットをスキップ"
          else
            git commit -m "chore: 週次サイト更新 $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push失敗 ($i/3)。リベースして再試行します"
              git pull --rebase origin main
            done
            echo "3回試しても push できませんでした"; exit 1
          fi
